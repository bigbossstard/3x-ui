name: "CodeQL Advanced"

on:
  push:
    branches:
      - main
      - client-host
    tags-ignore:
      - "v*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-client-host.yml"
      - ".github/workflows/upstream-sync.yml"
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "frontend/**"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/ci.yml"
      - "tools/update-client-host.sh"
      - "tools/install-client-host.sh"
  schedule:
    - cron: "18 2 * * 2"

concurrency:
  group: client-host-codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: true
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: matrix.language == 'go'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle
        if: matrix.language == 'go'
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
