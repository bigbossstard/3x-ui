name: Upstream Sync Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: client-host-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout client-host
        uses: actions/checkout@v7
        with:
          ref: client-host
          fetch-depth: 0
          persist-credentials: false

      - name: Configure upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream main

      - name: Test-merge upstream main
        run: |
          set -euo pipefail
          git checkout -B automation/upstream-sync refs/remotes/origin/client-host
          if git merge --no-edit upstream/main; then
            echo "Upstream main merged without conflicts."
          else
            conflict_paths="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflict_paths" ]]; then
              git merge --abort || true
              echo "::error::The upstream merge failed without a resolvable conflict set."
              exit 1
            fi

            echo "Resolving only reviewed conflict classes:"
            printf '%s\n' "$conflict_paths"

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                .github/workflows/*)
                  # This fork deliberately owns its workflow set; upstream workflow changes
                  # are not imported into a fork that uses its own CI/release pipeline.
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                README.md)
                  # This fork's README is an intentional Client-Host installation guide.
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                internal/sub/host_sub_test.go)
                  # Keep upstream's TLS subscription regression test and re-append only the
                  # four Client-Host-specific test functions from our side of the merge.
                  python3 - "$path" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          path = sys.argv[1]
          local = subprocess.check_output(["git", "show", f":2:{path}"], text=True)
          upstream = subprocess.check_output(["git", "show", f":3:{path}"], text=True)

          funcs = list(re.finditer(r"^func (\w+)\(", local, re.MULTILINE))
          wanted = []
          for i, match in enumerate(funcs):
              name = match.group(1)
              if not re.fullmatch(r"TestSub_Client(?:Host|GroupHost)\w*", name):
                  continue
              if re.search(rf"^func {re.escape(name)}\(", upstream, re.MULTILINE):
                  continue
              end = funcs[i + 1].start() if i + 1 < len(funcs) else len(local)
              block = local[match.start():end].strip()
              if block:
                  wanted.append(block)

          if not wanted:
              raise SystemExit("No Client-Host-only subscription tests were found to preserve.")
          merged = upstream.rstrip() + "\n\n" + "\n\n".join(wanted) + "\n"
          pathlib.Path(path).write_text(merged, encoding="utf-8")
          PY
                  git add "$path"
                  ;;
                internal/tuic/manager_live_traffic_test.go|internal/tuic/relay_logging_test.go|internal/tuic/server_test.go|internal/tuic/stream_udp_lifecycle_test.go)
                  # These conflicts are test harness updates; keep upstream's newer
                  # deterministic QUIC stream-close and traffic-accounting assertions.
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                internal/web/translation/*.json)
                  # Deep-merge locale objects: keep upstream values for keys present in both,
                  # and preserve every Client-Host-only key at any nesting depth.
                  python3 - "$path" <<'PY'
          import copy
          import json
          import pathlib
          import subprocess
          import sys

          path = sys.argv[1]
          local = json.loads(subprocess.check_output(["git", "show", f":2:{path}"], text=True))
          upstream = json.loads(subprocess.check_output(["git", "show", f":3:{path}"], text=True))

          def merge(up, own):
              if isinstance(up, dict) and isinstance(own, dict):
                  result = copy.deepcopy(up)
                  for key, value in own.items():
                      if key not in result:
                          result[key] = copy.deepcopy(value)
                      elif isinstance(result[key], dict) and isinstance(value, dict):
                          result[key] = merge(result[key], value)
                  return result
              return copy.deepcopy(up)

          merged = merge(upstream, local)
          if not isinstance(merged, dict):
              raise SystemExit(f"Expected locale JSON object in {path}")
          pathlib.Path(path).write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
                  git add "$path"
                  ;;
                *)
                  git merge --abort || true
                  echo "::error::Unexpected upstream conflict in '$path'. No automatic resolution was attempted."
                  exit 1
                  ;;
              esac
            done <<< "$conflict_paths"

            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              git merge --abort || true
              echo "::error::Unresolved conflicts remain after the reviewed resolution rules."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

          # Keep the entire workflow tree from client-host. This avoids importing upstream
          # Actions into the fork and avoids requiring the automation token to create workflows.
          git rm -r -f .github/workflows
          git checkout refs/remotes/origin/client-host -- .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if ! git diff --check refs/remotes/origin/client-host...HEAD; then
            echo "::error::The upstream merge introduced whitespace errors."
            git diff --check refs/remotes/origin/client-host...HEAD
            exit 1
          fi

      - name: Push merge candidate and open/update upstream-sync PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push --force origin automation/upstream-sync

          body="$(cat <<'EOF'
          Automated upstream merge check against MHSanaei/3x-ui main.

          This PR contains upstream changes only; client-host remains the base.
          The automation dispatches full CI and CodeQL explicitly because events
          created with GITHUB_TOKEN do not automatically start other workflows.
          The PR is merged only after both checks pass for its exact head SHA.
          EOF
          )"

          pr_number="$(gh pr list --repo "$REPO" --state open --head automation/upstream-sync --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$REPO" \
              --title "chore: sync client-host with upstream" \
              --body "$body"
          else
            gh pr create --repo "$REPO" \
              --base client-host \
              --head automation/upstream-sync \
              --title "chore: sync client-host with upstream" \
              --body "$body"
            pr_number="$(gh pr list --repo "$REPO" --state open --head automation/upstream-sync --json number --jq '.[0].number // empty')"
          fi

          [[ "$pr_number" =~ ^[0-9]+$ ]] || {
            echo "::error::Could not create or resolve the upstream-sync pull request."
            exit 1
          }
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI and CodeQL for exact upstream PR head
        id: dispatch-ci
        if: steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          candidate_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the exact upstream-sync PR head."
            exit 1
          }
          gh workflow run ci.yml --repo "$REPO" --ref automation/upstream-sync
          gh workflow run codeql.yml --repo "$REPO" --ref automation/upstream-sync
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Dispatched CI and CodeQL for $candidate_sha"

      - name: Wait for full CI and CodeQL on the exact upstream PR head
        id: wait-ci
        if: steps.dispatch-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          TESTED_SHA: ${{ steps.dispatch-ci.outputs.sha }}
        run: |
          set -euo pipefail

          get_run() {
            local workflow="$1"
            local runs
            runs="$(gh run list --repo "$REPO" --workflow "$workflow" --branch automation/upstream-sync --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,createdAt || true)"
            [[ -n "$runs" ]] || return 0
            printf '%s' "$runs" | jq -r --arg sha "$TESTED_SHA" '
              map(select(.headSha == $sha))
              | sort_by(.createdAt) | reverse
              | (.[0] // {})
              | if .databaseId == null then empty
                else [.databaseId, .status, .conclusion] | @tsv end
            '
          }

          ci_ready=0
          codeql_ready=0
          for attempt in {1..180}; do
            current_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
            [[ "$current_sha" == "$TESTED_SHA" ]] || {
              echo "::error::The upstream-sync PR head changed while checks were running; refusing to merge untested code."
              exit 1
            }

            ci_line="$(get_run ci.yml)"
            if [[ -n "$ci_line" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<<"$ci_line"
              echo "CI run=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$REPO" --log-failed || true
                  echo "::error::Full CI failed for the exact upstream-sync PR head. The PR is left open for inspection."
                  exit 1
                fi
                ci_ready=1
              fi
            fi

            codeql_line="$(get_run codeql.yml)"
            if [[ -n "$codeql_line" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<<"$codeql_line"
              echo "CodeQL run=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$REPO" --log-failed || true
                  echo "::error::CodeQL failed for the exact upstream-sync PR head. The PR is left open for inspection."
                  exit 1
                fi
                codeql_ready=1
              fi
            fi

            if (( ci_ready == 1 && codeql_ready == 1 )); then
              final_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
              [[ "$final_sha" == "$TESTED_SHA" ]] || {
                echo "::error::The upstream-sync PR head changed after CI/CodeQL passed; refusing to merge."
                exit 1
              }
              echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for full CI and CodeQL on the exact upstream-sync PR head."
          exit 1

      - name: Merge only the exact tested PR head
        if: steps.wait-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          TESTED_SHA: ${{ steps.wait-ci.outputs.sha }}
        run: |
          set -euo pipefail
          final_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          [[ "$final_sha" == "$TESTED_SHA" ]] || {
            echo "::error::The PR head changed after the recorded CI result; refusing to merge untested code."
            exit 1
          }
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$TESTED_SHA"

      - name: Dispatch post-merge CI, CodeQL, and Client-Host build
        if: steps.wait-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          merged_sha=""
          for attempt in {1..30}; do
            merged_sha="$(gh api "repos/$REPO/git/ref/heads/client-host" --jq '.object.sha' 2>/dev/null || true)"
            if [[ "$merged_sha" =~ ^[0-9a-f]{40}$ && "$merged_sha" != "${{ steps.wait-ci.outputs.sha }}" ]]; then
              break
            fi
            sleep 2
          done
          [[ "$merged_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not resolve the post-merge client-host head."
            exit 1
          }
          echo "Post-merge client-host head: $merged_sha"
          gh workflow run ci.yml --repo "$REPO" --ref client-host
          gh workflow run codeql.yml --repo "$REPO" --ref client-host
          gh workflow run build-client-host.yml --repo "$REPO" --ref client-host
          echo "Dispatched post-merge CI, CodeQL, and Client-Host release build."
