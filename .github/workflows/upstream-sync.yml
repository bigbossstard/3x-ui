name: Upstream Sync Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync.yml"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: client-host-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout client-host
        uses: actions/checkout@v7
        with:
          ref: client-host
          fetch-depth: 0
          persist-credentials: false

      - name: Configure upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/MHSanaei/3x-ui.git
          git fetch upstream main

      - name: Test-merge upstream main
        id: candidate
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse refs/remotes/origin/client-host)"
          git checkout -B automation/upstream-sync refs/remotes/origin/client-host

          if git merge --no-edit upstream/main; then
            echo "Upstream main merged without conflicts."
          else
            conflict_paths="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflict_paths" ]]; then
              git merge --abort || true
              echo "::error::The upstream merge failed without a resolvable conflict set."
              exit 1
            fi

            echo "Resolving only reviewed conflict classes:"
            printf '%s\n' "$conflict_paths"

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                .github/workflows/*)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                README.md)
                  # Preserve the fork-specific Client-Host installation guide.
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                internal/sub/host_sub_test.go)
                  # Keep upstream's TLS subscription regression test and preserve the
                  # four Client-Host-only subscription tests.
                  python3 - "$path" <<'PY'
          import pathlib
          import re
          import subprocess
          import sys

          path = sys.argv[1]
          local = subprocess.check_output(["git", "show", f":2:{path}"], text=True)
          upstream = subprocess.check_output(["git", "show", f":3:{path}"], text=True)
          funcs = list(re.finditer(r"^func (\w+)\(", local, re.MULTILINE))
          wanted = []
          for i, match in enumerate(funcs):
              name = match.group(1)
              if not re.fullmatch(r"TestSub_Client(?:Host|GroupHost)\w*", name):
                  continue
              if re.search(rf"^func {re.escape(name)}\(", upstream, re.MULTILINE):
                  continue
              end = funcs[i + 1].start() if i + 1 < len(funcs) else len(local)
              block = local[match.start():end].strip()
              if block:
                  wanted.append(block)
          if not wanted:
              raise SystemExit("No Client-Host-only subscription tests were found to preserve.")
          pathlib.Path(path).write_text(
              upstream.rstrip() + "\n\n" + "\n\n".join(wanted) + "\n",
              encoding="utf-8",
          )
          PY
                  git add "$path"
                  ;;
                internal/tuic/manager_live_traffic_test.go|internal/tuic/relay_logging_test.go|internal/tuic/server_test.go|internal/tuic/stream_udp_lifecycle_test.go)
                  # Use upstream's newer deterministic QUIC and traffic-test harness.
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                internal/web/translation/*.json)
                  # Prefer upstream on duplicate keys; retain Client-Host-only keys recursively.
                  python3 - "$path" <<'PY'
          import copy
          import json
          import pathlib
          import subprocess
          import sys

          path = sys.argv[1]
          local = json.loads(subprocess.check_output(["git", "show", f":2:{path}"], text=True))
          upstream = json.loads(subprocess.check_output(["git", "show", f":3:{path}"], text=True))

          def merge(up, own):
              if isinstance(up, dict) and isinstance(own, dict):
                  result = copy.deepcopy(up)
                  for key, value in own.items():
                      if key not in result:
                          result[key] = copy.deepcopy(value)
                      elif isinstance(result[key], dict) and isinstance(value, dict):
                          result[key] = merge(result[key], value)
                  return result
              return copy.deepcopy(up)

          merged = merge(upstream, local)
          if not isinstance(merged, dict):
              raise SystemExit(f"Expected locale JSON object in {path}")
          pathlib.Path(path).write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
                  git add "$path"
                  ;;
                *)
                  git merge --abort || true
                  echo "::error::Unexpected upstream conflict in '$path'. No automatic resolution was attempted."
                  exit 1
                  ;;
              esac
            done <<< "$conflict_paths"

            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              git merge --abort || true
              echo "::error::Unresolved conflicts remain after the reviewed resolution rules."
              git diff --name-only --diff-filter=U
              exit 1
            fi
            git commit --no-edit
          fi

          # The fork owns its Actions definitions. Restore that directory to the exact
          # client-host version so upstream workflows are not imported into this fork.
          git rm -r -f .github/workflows
          git checkout refs/remotes/origin/client-host -- .github/workflows
          git add .github/workflows
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          # The Client-Host UI requires a hosts prop; adapt upstream's renewal-help test,
          # which intentionally does not exercise host selection, to pass an empty host list.
          python3 - <<'PY'
          import pathlib

          path = pathlib.Path("frontend/src/test/client-renewal-help.test.tsx")
          content = path.read_text(encoding="utf-8")
          marker = "      attachedIds={[1]}\\n      inbounds="
          replacement = "      attachedIds={[1]}\\n      hosts={[]}\\n      inbounds="
          if "      hosts={[]}\\n" not in content:
              if marker not in content:
                  raise SystemExit("Expected ClientFormModal test fixture was not found; refusing to patch an unknown layout.")
              content = content.replace(marker, replacement, 1)
              path.write_text(content, encoding="utf-8")
          PY
          git add frontend/src/test/client-renewal-help.test.tsx
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi

          if ! git diff --check refs/remotes/origin/client-host...HEAD; then
            echo "::error::The upstream merge introduced whitespace errors."
            git diff --check refs/remotes/origin/client-host...HEAD
            exit 1
          fi

          candidate_sha="$(git rev-parse HEAD)"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Prepared candidate $candidate_sha with base $base_sha"

      - name: Push merge candidate branch
        id: publish-candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          remote_base="$(git ls-remote origin refs/heads/client-host | awk '{print $1}')"
          [[ "$remote_base" == "$BASE_SHA" ]] || {
            echo "::error::client-host moved before the candidate was published; refusing to test a stale base."
            exit 1
          }
          gh auth setup-git
          git push --force origin automation/upstream-sync
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch full CI and CodeQL for exact candidate
        id: dispatch-ci
        if: steps.publish-candidate.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$REPO" --ref automation/upstream-sync
          gh workflow run codeql.yml --repo "$REPO" --ref automation/upstream-sync
          echo "sha=${{ steps.publish-candidate.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Wait for full CI and CodeQL on the exact candidate
        id: wait-ci
        if: steps.dispatch-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ steps.dispatch-ci.outputs.sha }}
        run: |
          set -euo pipefail

          get_run() {
            local workflow="$1"
            local runs
            runs="$(gh run list --repo "$REPO" --workflow "$workflow" --branch automation/upstream-sync --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,createdAt || true)"
            [[ -n "$runs" ]] || return 0
            printf '%s' "$runs" | jq -r --arg sha "$TESTED_SHA" '
              map(select(.headSha == $sha))
              | sort_by(.createdAt) | reverse
              | (.[0] // {})
              | if .databaseId == null then empty
                else [.databaseId, .status, .conclusion] | @tsv end
            '
          }

          ci_ready=0
          codeql_ready=0
          for attempt in {1..180}; do
            candidate_now="$(gh api "repos/$REPO/git/ref/heads/automation/upstream-sync" --jq '.object.sha')"
            [[ "$candidate_now" == "$TESTED_SHA" ]] || {
              echo "::error::The candidate branch changed while checks were running; refusing to publish an untested commit."
              exit 1
            }

            ci_line="$(get_run ci.yml)"
            if [[ -n "$ci_line" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<<"$ci_line"
              echo "CI run=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$REPO" --log-failed || true
                  echo "::error::Full CI failed for the exact candidate. client-host was not changed."
                  exit 1
                fi
                ci_ready=1
              fi
            fi

            codeql_line="$(get_run codeql.yml)"
            if [[ -n "$codeql_line" ]]; then
              IFS=$'\t' read -r run_id status conclusion <<<"$codeql_line"
              echo "CodeQL run=$run_id status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                if [[ "$conclusion" != "success" ]]; then
                  gh run view "$run_id" --repo "$REPO" --log-failed || true
                  echo "::error::CodeQL failed for the exact candidate. client-host was not changed."
                  exit 1
                fi
                codeql_ready=1
              fi
            fi

            if (( ci_ready == 1 && codeql_ready == 1 )); then
              echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for CI and CodeQL on the exact candidate."
          exit 1

      - name: Advance client-host to the exact tested merge commit
        if: steps.wait-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.candidate.outputs.base_sha }}
          TESTED_SHA: ${{ steps.wait-ci.outputs.sha }}
        run: |
          set -euo pipefail
          current_base="$(gh api "repos/$REPO/git/ref/heads/client-host" --jq '.object.sha')"
          [[ "$current_base" == "$BASE_SHA" ]] || {
            echo "::error::client-host moved after testing began; refusing to overwrite newer changes."
            exit 1
          }
          candidate_sha="$(gh api "repos/$REPO/git/ref/heads/automation/upstream-sync" --jq '.object.sha')"
          [[ "$candidate_sha" == "$TESTED_SHA" ]] || {
            echo "::error::Candidate ref changed after CI/CodeQL passed; refusing to advance client-host."
            exit 1
          }
          gh api --method PATCH "repos/$REPO/git/refs/heads/client-host" -f sha="$TESTED_SHA" >/dev/null
          echo "client-host advanced to verified merge commit $TESTED_SHA"

      - name: Dispatch post-merge CI, CodeQL, and Client-Host build
        if: steps.wait-ci.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: ${{ steps.wait-ci.outputs.sha }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$REPO/git/ref/heads/client-host" --jq '.object.sha')"
          [[ "$current_sha" == "$MERGED_SHA" ]] || {
            echo "::error::client-host does not point to the exact tested merge commit."
            exit 1
          }
          gh workflow run ci.yml --repo "$REPO" --ref client-host
          gh workflow run codeql.yml --repo "$REPO" --ref client-host
          gh workflow run build-client-host.yml --repo "$REPO" --ref client-host
          echo "Dispatched post-merge CI, CodeQL, and Client-Host release build."
