name: One-off repository cleanup

on:
  push:
    branches: [client-host]
    paths:
      - .github/workflows/repo-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Delete obsolete branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            "automation/format-probe" \
            "automation/gofumpt-probe" \
            "automation/swiss-clock-hardening" \
            "client-host-v385"; do
            echo "Deleting $branch..."
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" --delete "$branch"
          done
